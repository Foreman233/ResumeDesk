name: Windows CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm and Rust
        run: |
          npm install --global pnpm@11.25.0
          rustup toolchain install stable --profile minimal --component rustfmt
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript and build the frontend
        run: pnpm build
      - name: Run frontend tests
        run: pnpm test
      - name: Check Rust formatting
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust
        run: cargo +stable check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test the desktop backend
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
