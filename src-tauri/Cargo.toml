[package]
name = "resumedesk"
version = "1.5.1"
description = "ResumeDesk 本地简历工作台"
edition = "2024"
rust-version = "1.91"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
age = { version = "0.11", default-features = false }
async-trait = "0.1"
hex = "0.4"
quick-xml = "0.38"
rand = "0.9"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tempfile = "3"
tokio = { version = "1", features = ["time", "macros", "sync", "net", "io-util", "rt-multi-thread"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
desktop-test = ["tauri/devtools"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
